# ============================================================
#  非遗志 · HeritageWiki —— MkDocs 站点配置
#  本地预览：运行 serve.bat（Windows）或 serve.sh（Git Bash）
#  手动命令：.venv\Scripts\python.exe -m mkdocs serve --dev-addr 127.0.0.1:8000
# ============================================================

# 发布到 GitHub Pages 后，把下一行改成你的真实地址并取消注释（影响 sitemap.xml 与分享卡片）：
# site_url: https://<你的用户名>.github.io/Heritage-Wiki/

site_name: 非遗志 · 世界非物质文化遗产百科
site_description: 人间百工，皆有来处。以图文汇录世界非物质文化遗产——中国十大门类、1557 项国家级代表性项目全量收录。
site_author: 非遗志 HeritageWiki
copyright: >
  非遗志 · HeritageWiki ｜ 名录数据：国务院公布「国家级非物质文化遗产代表性项目名录」，经中国非物质文化遗产网（ihchina.cn）整理<br>
  本志为公益性知识项目，欢迎指正补遗

theme:
  name: material
  language: zh
  logo: assets/brand/logo.png
  favicon: assets/brand/favicon.png
  font: false          # 使用系统字体栈（详见 stylesheets/extra.css）
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 墨夜模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 宣纸模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/heroes.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      title: 本页目录
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search

